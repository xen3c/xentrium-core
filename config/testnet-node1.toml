# Xentrium Testnet Node 1 (Bootstrap)
[node]
node_id = "testnet-node-1"
address = "0.0.0.0"
port = 30303
data_dir = "./data/testnet-node1"

[network]
bootstrap_peers = []
max_peers = 50
heartbeat_interval_secs = 30
connection_timeout_secs = 120

[consensus]
auto_committee_rotation = true
snapshot_interval_hours = 24

[logging]
level = "info"
file = "./data/testnet-node1/xentrium.log"
