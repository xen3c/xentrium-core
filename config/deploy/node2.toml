# Xentrium First Testnet — Node 2
# Replace <NODE1_PUBLIC_IP> with node1's public IPv4 before launch.
# If node2 has a public IP / port forwarding, peers can reach it directly;
# otherwise it connects outbound to node1 and receives traffic over that connection.

[node]
node_id = "testnet-node-2"
address = "0.0.0.0"
port = 30304
data_dir = "./data/node2"

[network]
bootstrap_peers = ["<NODE1_PUBLIC_IP>:30303"]
max_peers = 50
heartbeat_interval_secs = 30
connection_timeout_secs = 120
allowed_node_ids = []
# --- abuse protection (open testnet) ---
max_conns_per_ip = 3        # simultaneous connections allowed from one IP
handshake_rate_per_min = 20 # new handshakes per minute per IP
ban_duration_secs = 300     # temp-ban duration after strike threshold
ban_strike_threshold = 10   # abuse strikes that trigger a temp ban
msg_rate_per_min = 1200     # per-connection msg ceiling (protected types have stricter caps)

[consensus]
auto_committee_rotation = true
snapshot_interval_hours = 24
self_register_validator = true
announce_interval_secs = 30
committee_epoch_secs = 300
snapshot_epoch_secs = 300
committee_max_size = 51
snapshot_retention = 20
metrics_port = 9102

[logging]
level = "info"
file = "./data/node2/xentrium.log"
