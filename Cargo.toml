[workspace]
members = [
    "xentrium-shared",
    "xentrium-storage",
    "xentrium-crypto",
    "xentrium-consensus",
    "xentrium-network",
    "xentrium-node",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Xentrium Core Team"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Cryptography
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
rand = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
bs58 = "0.5"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
